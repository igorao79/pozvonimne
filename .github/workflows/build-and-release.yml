name: Create Test Release

on:
  workflow_dispatch:

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Test Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: test-${{ github.run_number }}
          name: Test Release ${{ github.run_number }}
          body: |
            Тестовый релиз для проверки работы GitHub Actions

            Этот релиз создан для тестирования автоматизации релизов.
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build Electron app
        run: npm run build:electron:app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |
            Автоматический релиз #${{ github.run_number }}

            ## Изменения
            - Автоматическая сборка при пуше в основную ветку

            ## Скачивание
            - Linux: pozvonimne-*.AppImage
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
