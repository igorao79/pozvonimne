name: Build and Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Quick config validation
        run: |
          echo "🔍 Быстрая проверка конфигурации electron-builder..."
          node -e "
            const config = require('./electron-builder.json');
            console.log('✅ electron-builder.json загружен успешно');
            console.log('📦 Targets:', Object.keys(config).filter(k => ['win', 'mac', 'linux'].includes(k)));
          "
          
          # Проверяем что иконки существуют
          if [ -f "public/logo.png" ]; then
            echo "✅ Logo PNG найден"
          else
            echo "❌ Logo PNG не найден!"
            exit 1
          fi
          
          echo "🎉 Валидация прошла успешно!"

  create-release:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }}
          body: |
            🎉 Новый релиз приложения Позвони.мне для Windows
            
            ### 📦 Скачать для Windows:
            - **NSIS Installer**: `.exe` установщик (готовится...)
            - **Portable**: портативная версия (готовится...)
            
            ### ✨ Изменения:
            - Новая версия приложения
            - Исправления и улучшения
            - Оптимизация для Windows
            
            🔄 **Статус**: Файлы собираются, будут добавлены автоматически...
          draft: true
          prerelease: false

  build:
    needs: [validate, create-release]
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: |
          $runNumber = "${{ github.run_number }}"
          $version = "0.1.$runNumber"
          Write-Host "Генерируем версию на основе номера run"
          Write-Host "New version: $version"
          
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $packageJson.version = $version
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content "package.json"
          Write-Host "Updated version to: $version"

      - name: Build Next.js app
        run: npm run build

      - name: Build Electron app
        run: npm run build:electron:app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  update-release:
    needs: [validate, create-release, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact structure
        run: |
          echo "🔍 Проверяем структуру artifacts:"
          find artifacts -name "*.exe" -type f
          echo "📁 Полная структура:"
          ls -la artifacts/

      - name: Upload exe files to existing release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          files: |
            artifacts/release-windows/*.exe

      - name: Publish Release (remove draft)
        run: |
          gh release edit v0.1.${{ github.run_number }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
