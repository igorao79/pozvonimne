name: Build and Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: |
          # Генерируем версию на основе номера run
          RUN_NUM=${{ github.run_number }}
          VERSION="0.1.${RUN_NUM}"
          TAG="v${VERSION}"
          echo "New version: $VERSION"
          echo "New tag: $TAG"

          # Обновляем package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          grep '"version"' package.json

          # Создаем и пушим тег.
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build Next.js app
        run: npm run build

      - name: Build Electron app and publish draft release
        run: npm run build:electron:app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Personal Access Token с правами repo
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pozvonimne-linux
          path: release/*
