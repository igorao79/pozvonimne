name: Build and Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Quick config validation
        run: |
          echo "🔍 Быстрая проверка конфигурации electron-builder..."
          node -e "
            const config = require('./electron-builder.json');
            console.log('✅ electron-builder.json загружен успешно');
            console.log('📦 Targets:', Object.keys(config).filter(k => ['win', 'mac', 'linux'].includes(k)));
            
            // Проверяем все files из конфигурации
            const files = config.files || [];
            console.log('📁 Проверяем файлы из electron-builder.json:');
            const fs = require('fs');
            files.forEach(file => {
              if (!file.includes('*') && !file.includes('node_modules')) {
                if (fs.existsSync(file)) {
                  console.log('✅', file);
                } else {
                  console.error('❌ Файл не найден:', file);
                  process.exit(1);
                }
              }
            });
          "
          
          # Проверяем что иконки существуют
          if [ -f "public/logo.png" ]; then
            echo "✅ Logo PNG найден"
          else
            echo "❌ Logo PNG не найден!"
            exit 1
          fi
          
          # Проверяем зависимости require в main.js
          echo "🔍 Проверяем зависимости в electron/main.js..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packageJson = require('./package.json');
            
            if (fs.existsSync('electron/main.js')) {
              const mainJs = fs.readFileSync('electron/main.js', 'utf8');
              
              // Проверяем локальные модули
              const localRequires = mainJs.match(/require\(['\']\.\/[^'\"]*['\'']\)/g) || [];
              localRequires.forEach(req => {
                const modulePath = req.match(/require\(['\']\.\/([^'\"]*)['\'']\)/)[1];
                const fullPath = path.join('electron', modulePath + '.js');
                
                if (fs.existsSync(fullPath)) {
                  console.log('✅ Локальный модуль найден:', modulePath);
                } else {
                  console.error('❌ Локальный модуль не найден:', fullPath);
                  process.exit(1);
                }
              });
              
              // Проверяем npm пакеты
              const npmRequires = mainJs.match(/require\(['\'][^'\"\.\/][^'\"]*['\'']\)/g) || [];
              npmRequires.forEach(req => {
                const packageName = req.match(/require\(['\']([^'\"]*)['\'']\)/)[1];
                if (packageName !== 'electron' && packageName !== 'path' && packageName !== 'fs') {
                  const allDeps = {...(packageJson.dependencies || {}), ...(packageJson.devDependencies || {})};
                  if (allDeps[packageName]) {
                    console.log('✅ npm пакет найден:', packageName);
                  } else {
                    console.error('❌ npm пакет не найден в dependencies:', packageName);
                    process.exit(1);
                  }
                }
              });
              
              // Проверяем синтаксис JavaScript
              try {
                new Function(mainJs);
                console.log('✅ Синтаксис main.js корректен');
              } catch (syntaxError) {
                console.error('❌ Синтаксическая ошибка в main.js:', syntaxError.message);
                process.exit(1);
              }
            }
          "
          
          echo "🎉 Валидация прошла успешно!"

  create-release:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }}
          body: |
            🎉 Новый релиз приложения Позвони.мне для Windows
            
            ### 📦 Скачать для Windows:
            - **NSIS Installer**: `.exe` установщик (готовится...)
            - **Portable**: портативная версия (готовится...)
            
            ### ✨ Изменения:
            - Новая версия приложения
            - Исправления и улучшения
            - Оптимизация для Windows
            
            🔄 **Статус**: Файлы собираются, будут добавлены автоматически...
          draft: true
          prerelease: false

  build:
    needs: [validate, create-release]
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: |
          $runNumber = "${{ github.run_number }}"
          $version = "0.1.$runNumber"
          Write-Host "Генерируем версию на основе номера run"
          Write-Host "New version: $version"
          
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $packageJson.version = $version
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content "package.json"
          Write-Host "Updated version to: $version"

      - name: Clean and optimize dependencies
        run: |
          Write-Host "🧹 Очистка временных файлов..."
          if (Test-Path ".next") { Remove-Item -Recurse -Force ".next" }
          if (Test-Path "out") { Remove-Item -Recurse -Force "out" }
          if (Test-Path "release") { Remove-Item -Recurse -Force "release" }
          
          Write-Host "📦 Очистка node_modules от dev зависимостей..."
          npm prune --production
          
          Write-Host "🔧 Переустановка всех зависимостей..."
          npm ci

      - name: Build Next.js app (Production)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          ANALYZE: false

      - name: Optimize build output
        run: |
          Write-Host "🎯 Оптимизация размера сборки..."
          
          # Удаляем ненужные файлы из out директории
          if (Test-Path "out") {
            Write-Host "📁 Очистка out директории от ненужных файлов..."
            Get-ChildItem -Path "out" -Recurse -Include "*.map", "*.txt", "*.md" | Remove-Item -Force -ErrorAction SilentlyContinue
            
            # Показываем размер out директории
            $outSize = (Get-ChildItem -Path "out" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "📊 Размер out директории: $([math]::Round($outSize, 2)) MB"
          }

      - name: Build Electron app (Optimized)
        run: npm run build:electron:app
        env:
          NODE_ENV: production
          ELECTRON_BUILD: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Show build results
        run: |
          Write-Host "🎉 Результаты сборки:"
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -Recurse -Include "*.exe" | ForEach-Object {
              $sizeInMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "📦 $($_.Name): $sizeInMB MB"
            }
            
            $totalSize = (Get-ChildItem -Path "release" -Recurse -Include "*.exe" | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "📊 Общий размер exe файлов: $([math]::Round($totalSize, 2)) MB"
            
            if ($totalSize -lt 150) {
              Write-Host "✅ Отлично! Размер приложения оптимизирован до $([math]::Round($totalSize, 2)) MB"
            } elseif ($totalSize -lt 200) {
              Write-Host "⚠️  Размер приложения: $([math]::Round($totalSize, 2)) MB - неплохо, но можно лучше"
            } else {
              Write-Host "❌ Размер приложения: $([math]::Round($totalSize, 2)) MB - требуется дополнительная оптимизация"
            }
          } else {
            Write-Host "❌ Директория release не найдена!"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  update-release:
    needs: [validate, create-release, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact structure
        run: |
          echo "🔍 Проверяем структуру artifacts:"
          find artifacts -name "*.exe" -type f
          echo "📁 Полная структура:"
          ls -la artifacts/

      - name: Upload exe files to existing release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          files: |
            artifacts/release-windows/*.exe

      - name: Publish Release (remove draft)
        run: |
          echo "Publishing release v0.1.${{ github.run_number }}..."
          gh release edit v0.1.${{ github.run_number }} --draft=false
          echo "Release published successfully!"
          
          # Ждём секунду и проверяем статус
          sleep 2
          gh release view v0.1.${{ github.run_number }} --json isDraft,assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
