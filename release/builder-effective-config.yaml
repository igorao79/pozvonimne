directories:
  output: release
  buildResources: electron
appId: com.pozvonimne.app
productName: Позвони.мне
copyright: Copyright © 2025 Позвони.мне
publish:
  provider: github
  owner: igorao79
  repo: pozvonimne
files:
  - filter:
      - out/**/*
      - electron/main.js
      - electron/preload.js
      - node_modules/**/*
      - package.json
extraResources:
  - from: public
    to: public
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
        - ia32
  icon: public/logo.ico
  verifyUpdateCodeSignature: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: public/logo.icns
  category: public.app-category.productivity
  entitlements: electron/entitlements.plist
  entitlementsInherit: electron/entitlements.plist
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: public/logo.png
  category: Network
  synopsis: Простое приложение для голосовых звонков
  description: Простое и безопасное приложение для аудио звонков с WebRTC
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: public/logo.ico
  uninstallerIcon: public/logo.ico
  installerHeaderIcon: public/logo.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Позвони.мне
portable:
  artifactName: pozvonimne-portable-${version}.${ext}
dmg:
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  icon: public/logo.icns
  format: ULFO
compression: maximum
nodeGypRebuild: true
buildDependenciesFromSource: true
npmRebuild: true
nodeVersion: 18.17.0
afterAllArtifactBuild: scripts/after-build.js
electronVersion: 38.2.0
