<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Позвони.мне - Загрузка</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .progress-container {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .status {
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
            min-height: 20px;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-width: 400px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo">📞</div>
    <div class="title">Позвони.мне</div>
    <div class="spinner"></div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="status">Запуск приложения...</div>
    <div class="error" id="error"></div>

    <script>
        const { ipcRenderer } = require('electron');

        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        const error = document.getElementById('error');

        // Слушаем события от main процесса
        ipcRenderer.on('splash-progress', (event, data) => {
            progress = data.progress;
            progressBar.style.width = progress + '%';
            status.textContent = data.message;
        });

        ipcRenderer.on('splash-error', (event, errorMessage) => {
            error.textContent = errorMessage;
            error.style.display = 'block';
            status.textContent = 'Ошибка загрузки';
        });

        ipcRenderer.on('splash-close', () => {
            window.close();
        });

        // Симуляция прогресса для начала
        let currentProgress = 0;
        const interval = setInterval(() => {
            currentProgress += 2;
            if (currentProgress <= 20) {
                progressBar.style.width = currentProgress + '%';
            } else {
                clearInterval(interval);
            }
        }, 50);
    </script>
</body>
</html>
